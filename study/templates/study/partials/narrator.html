<section class="narrator card" data-narrator hidden aria-label="Lecture française" data-annotation-exclude>
  <div class="narrator__head">
    <strong>Lecture française</strong>
    <button type="button" class="btn btn--sm" data-narrator-close aria-label="Fermer et arrêter la lecture">Fermer</button>
  </div>
  <p data-narrator-status role="status" aria-live="polite"></p>
  <div class="narrator__controls">
    <button type="button" class="btn btn--sm" data-narrator-toggle>Pause</button>
    <button type="button" class="btn btn--sm" data-narrator-restart>Revenir au début</button>
    <label>Vitesse
      <select data-narrator-speed aria-label="Vitesse de narration">
        <option value="0.75">0,75×</option>
        <option value="0.85" selected>0,85×</option>
        <option value="1">1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
        <option value="1.75">1,75×</option>
        <option value="2">2×</option>
      </select>
    </label>
  </div>
  <p data-narrator-privacy hidden>
    Texte privé : une voix française locale est utilisée, sans envoi à Heureux ou à ElevenLabs pour cette lecture.
  </p>
</section>
