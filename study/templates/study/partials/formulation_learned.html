<form class="formulation-learned" method="post" action="{% url 'study:ee_formulation_progress' row.entry.slug %}">
  {% csrf_token %}
  {% for key, value in filter_fields %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
  {% if row.learned %}
    <button class="btn" name="completed" value="0" type="submit" aria-label="Remettre à apprendre : {{ row.entry.label }}">Apprise · Remettre à apprendre</button>
  {% else %}
    <button class="btn" name="completed" value="1" type="submit" aria-label="Je sais reproduire et adapter : {{ row.entry.label }}">Je sais reproduire et adapter</button>
  {% endif %}
</form>
