{% if item.case_sensitive %}<small>Capitalisation matters in this item.</small>{% endif %}
{% if item.terminal_punctuation_sensitive %}<small>Include the exact terminal punctuation.</small>{% endif %}
{% if item.kind == 'choice' %}
  <fieldset class="course-choices">
    <legend class="sr-only">{{ item.prompt }}</legend>
    {% for choice in item.choices %}
      <label><input type="radio" name="{{ field_name }}" value="{{ choice }}" required> <span lang="fr">{{ choice }}</span></label>
    {% endfor %}
  </fieldset>
{% else %}
  <label class="sr-only" for="answer-{{ item.id }}">French answer: {{ item.prompt }}</label>
  <input id="answer-{{ item.id }}" name="{{ field_name }}" type="text" maxlength="4000" lang="fr" autocomplete="off" autocapitalize="off" spellcheck="false">
{% endif %}
