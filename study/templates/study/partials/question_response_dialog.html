<dialog class="form-dialog question-response-dialog" id="question-response-dialog" aria-labelledby="question-response-title" data-question-response-dialog>
  <header class="form-dialog__header">
    <div class="form-dialog__heading">
      <span class="form-dialog__icon" aria-hidden="true">
        {% include "study/partials/ui_icon.html" with name="pencil" only %}
      </span>
      <div>
        <p>Expression orale · {{ task.name }}</p>
        <h2 id="question-response-title">Ma réponse</h2>
      </div>
    </div>
    <button class="icon-button form-dialog__close" type="button" aria-label="Fermer" title="Fermer" data-dialog-close>
      {% include "study/partials/ui_icon.html" with name="x" only %}
    </button>
  </header>
  <form
    class="form-dialog__form"
    method="post"
    action="{% url 'study:task_question_response' part.slug task.slug question_bank.number %}"
    data-question-response-form>
    {% csrf_token %}
    <input type="hidden" name="question_key" data-question-response-key>
    <div class="form-dialog__body">
      <p class="question-response-dialog__question" data-question-response-question></p>
      <p class="form-dialog__error" role="alert" hidden data-question-response-error></p>
      <div class="notes-form-field">
        <label for="question-response-body">Votre réponse</label>
        <textarea
          id="question-response-body"
          name="body"
          rows="10"
          maxlength="{{ question_response_max_length }}"
          placeholder="Rédigez ici votre réponse personnelle…"
          data-question-response-body></textarea>
        <small class="notes-form-field__hint">Écrivez une réponse personnelle que vous pourrez ensuite pratiquer à voix haute.</small>
      </div>
    </div>
    <footer class="form-dialog__actions">
      <button class="btn btn--danger question-response-dialog__delete hidden" type="submit" name="action" value="delete" data-question-response-delete>Supprimer</button>
      <button class="btn" type="button" data-dialog-close>Annuler</button>
      <button class="btn btn--primary" type="submit" name="action" value="save" data-question-response-save>Enregistrer</button>
    </footer>
  </form>
</dialog>
