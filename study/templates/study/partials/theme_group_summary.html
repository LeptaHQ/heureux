<summary class="t1-theme__head">
  <span class="t1-theme__chevron" aria-hidden="true">{% include "study/partials/ui_icon.html" with name="arrow-right" only %}</span>
  <span class="t1-theme__glyph" aria-hidden="true">{% include "study/partials/ui_icon.html" with name=icon only %}</span>
  <span class="t1-theme__title"{% if title_id %} id="{{ title_id }}"{% endif %}>
    {{ title }}
    {% if description %}<span class="t1-theme__description" lang="en">{{ description }}</span>{% endif %}
  </span>
  <span class="t1-theme__meta">
    <span class="t1-theme__count">{{ count }} {{ count_label }}{{ count|pluralize }}</span>
    <span class="progress-status progress-status--{{ status }}"{% if learning %} data-learning-module-status{% endif %}>{{ completed }}/{{ total }}</span>
  </span>
</summary>
