name: EO2 content

on:
  push:
    paths:
      - "study/content/tache_2/dialogues/**"
      - "study/content/tache_2/dialogue_history/**"
      - "study/content/tache_2/subjects/hints.json"
  pull_request:
    paths:
      - "study/content/tache_2/dialogues/**"
      - "study/content/tache_2/dialogue_history/**"
      - "study/content/tache_2/subjects/hints.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_PATH: /tmp/heureux-eo2-content.sqlite3
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: >-
          python manage.py test
          study.tests.test_tache_two_dialogues
          study.tests.test_tache_two_locations
          study.tests.test_subject_hints
          study.tests.test_question_bank
          study.tests.test_oral_highlights
          study.tests.test_content
          study.tests.test_import_content.ImportFingerprintTests
          --parallel
          --noinput
