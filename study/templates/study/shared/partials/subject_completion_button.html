<button type="submit" role="checkbox" data-subject-label="{{ label }}"
  aria-checked="{{ completed|yesno:'true,false' }}"
  aria-label="{% if completed %}Marquer ce sujet comme non terminé : {% else %}Marquer ce sujet comme terminé : {% endif %}{{ label }}"
  title="{% if completed %}Sujet terminé{% else %}Marquer comme terminé{% endif %}">
  {% include "study/shared/partials/ui_icon.html" with name="check" only %}
</button>
