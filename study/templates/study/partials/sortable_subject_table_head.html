<thead>
  <tr>
    <th scope="col" aria-sort="none">
      <button
        class="t1-table__sort-button"
        type="button"
        data-nested-table-sort="subject"
        data-sort-first-direction="ascending"
        data-sort-label="Sujet">
        <span>Sujet</span>
        <span class="t1-table__sort-indicator" aria-hidden="true">↕</span>
      </button>
    </th>
    <th scope="col" class="t1-table__versions-col">{{ secondary_label }}</th>
    <th scope="col" aria-sort="none">
      <button
        class="t1-table__sort-button"
        type="button"
        data-nested-table-sort="progress"
        data-sort-first-direction="descending"
        data-sort-label="Progression"
        data-sort-compact-label="État">
        <span class="t1-table__sort-label--full">Progression</span>
        <span class="t1-table__sort-label--compact">État</span>
        <span class="t1-table__sort-indicator" aria-hidden="true">↕</span>
      </button>
    </th>
  </tr>
</thead>
