{% if page.has_other_pages %}
  <nav class="collection-pagination" aria-label="Pagination">
    {% if page.has_previous %}<a class="btn" rel="prev" href="{% querystring page=page.previous_page_number %}">Précédent</a>{% endif %}
    <span>Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn" rel="next" href="{% querystring page=page.next_page_number %}">Suivant</a>{% endif %}
  </nav>
{% endif %}
