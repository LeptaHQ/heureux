<span class="eo3-language-controls" data-eo3-language-controls data-annotation-exclude hidden>
  <span class="recall-controls">
    <span class="recall-controls__label">Réponse</span>
    <span class="recall-controls__options" role="group" aria-label="Langue de la réponse">
      <button type="button" data-eo3-language-option="fr" data-flashcard-control aria-pressed="true">Français</button>
      <button type="button" data-eo3-language-option="en" data-flashcard-control aria-pressed="false"{% if not eo3_language.ready %} disabled{% endif %}>Anglais</button>
    </span>
  </span>
  <span class="muted" data-eo3-language-status role="status" aria-live="polite" hidden></span>
</span>
