<section class="eo3-cached-reader" data-eo3-series-panel data-annotation-exclude aria-label="Lecture continue des audios enregistrés" hidden>
  <audio data-eo3-series-audio preload="none" hidden></audio>
  <div class="eo3-cached-reader__head">
    <span class="eo3-cached-reader__label" data-eo3-series-state></span>
    <span class="eo3-cached-reader__counter" data-eo3-series-counter></span>
  </div>
  <a class="eo3-cached-reader__title" data-eo3-series-title target="_blank" rel="noopener noreferrer"></a>
  <div class="eo3-cached-reader__bar" role="progressbar" aria-label="Position de lecture" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-eo3-series-progress><span></span></div>
  <div class="eo3-cached-reader__controls">
    <span class="eo3-cached-reader__time" data-eo3-series-time>0:00 / –:–– · 0,85×</span>
    <div>
      <button class="icon-button" type="button" data-eo3-series-pause aria-label="Mettre en pause" title="Mettre en pause">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3"><path d="M8 5v14M16 5v14" data-eo3-series-pause-icon></path><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none" data-eo3-series-play-icon></path></svg>
      </button>
      <button class="icon-button" type="button" data-eo3-series-next aria-label="Audio enregistré suivant" title="Audio enregistré suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 5 10 7L5 19zM18 5v14"></path></svg>
      </button>
    </div>
  </div>
  <span class="eo3-cached-reader__safety" data-eo3-series-theme></span>
  <span class="eo3-cached-reader__skips" data-eo3-series-skips></span>
</section>
<p class="eo3-cached-reader__status" data-eo3-series-status data-annotation-exclude role="status" hidden></p>
