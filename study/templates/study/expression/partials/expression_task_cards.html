{% for t in tasks %}
  <a class="deck card deck--task{% if not t.task.available %} deck--soon{% endif %}" style="--deck-color: {{ t.task.color }};" href="{% url 'study:task_detail' part.slug t.task.slug %}">
    <div class="deck__body">
      <div class="deck__title">
        <span class="deck__icon">{% include "study/shared/partials/ui_icon.html" with name=t.task.icon only %}</span>
        <span class="deck__name">{{ t.task.name }}</span>
        <span class="deck__subtitle">{{ t.task.subtitle }}</span>
      </div>
      {% if t.task.available %}
        <span class="deck__go" aria-hidden="true">{% include "study/shared/partials/ui_icon.html" with name="arrow-right" only %}</span>
      {% else %}
        <div class="deck__status-cell"><span class="badge-soon">À venir</span></div>
      {% endif %}
    </div>
  </a>
{% endfor %}
