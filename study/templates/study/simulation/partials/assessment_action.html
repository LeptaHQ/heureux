<div class="lv-assessment__action">
  <button class="icon-button" id="lv-assess"
    {% if evaluation_providers|length > 1 %}
      type="button" aria-label="Choisir le modèle d’évaluation" title="Choisir le modèle d’évaluation" aria-expanded="false" aria-controls="writing-models"
    {% elif session_title_assessment %}
      type="submit" form="writing-evaluation-form" aria-label="Évaluer ma réponse" aria-describedby="writing-evaluation-disclosure" title="Évaluer ma réponse"
    {% else %}
      type="button" aria-label="Évaluer mon niveau" title="Évaluer mon niveau" disabled
    {% endif %}>{% include "study/shared/partials/ui_icon.html" with name="sparkles" only %}</button>
  <span class="lv-assessment__spinner" aria-hidden="true"></span>
  {% if evaluation_providers|length > 1 %}
    <div id="writing-models" class="custom-select__list lv-assessment__models" role="group" aria-label="Modèles d’évaluation" hidden>
      {% for provider in evaluation_providers %}
        <button class="custom-select__option" type="submit" form="writing-evaluation-form" name="provider" value="{{ provider }}" aria-pressed="{% if provider == evaluation_provider %}true{% else %}false{% endif %}">{{ provider|title }}{% include "study/shared/partials/ui_icon.html" with name="check" only %}</button>
      {% endfor %}
    </div>
  {% endif %}
</div>
