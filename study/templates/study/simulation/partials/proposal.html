<section id="lv-proposal" class="lv-proposal" hidden aria-labelledby="lv-proposal-title">
  <details class="lv-proposal__card lv-report-card" id="lv-proposal-card" open>
    <summary><h2 id="lv-proposal-title">{% include "study/shared/partials/ui_icon.html" with name="sparkles" only %} Proposition</h2></summary>
    {% if written %}
      <section class="ee1-evaluation__section" aria-labelledby="writing-corrections-title">
        <h3 id="writing-corrections-title">Corrections</h3>
        <ol class="ee1-evaluation__corrections" data-writing-corrections></ol>
        <p class="muted" data-writing-corrections-note hidden></p>
      </section>
      <section id="lv-proposal-rewrite" class="ee1-evaluation__section" aria-labelledby="lv-proposal-rewrite-title" hidden>
        <div class="lv-proposal__tools">
          <h3 id="lv-proposal-rewrite-title">Version révisée</h3>
          <p id="lv-proposal-count"></p>
        </div>
        <div class="lv-proposal__prose" id="lv-proposal-lines" lang="fr"></div>
      </section>
      <p class="muted" data-writing-rewrite-note hidden></p>
      <section class="ee1-evaluation__section" aria-labelledby="writing-suggestions-title" data-writing-suggestions-section hidden>
        <h3 id="writing-suggestions-title">Suggestions facultatives</h3>
        <ul class="lv-assessment__evidence" data-writing-suggestions></ul>
      </section>
    {% else %}
      <div class="lv-proposal__tools">
        <button type="button" class="icon-button" id="lv-proposal-copy" aria-label="Copier" title="Copier">
          {% include "study/shared/partials/ui_icon.html" with name="copy" only %}{% include "study/shared/partials/ui_icon.html" with name="check" icon_hidden=True only %}{% include "study/shared/partials/ui_icon.html" with name="alert-triangle" icon_hidden=True only %}
        </button>
        <span class="sr-only" id="lv-proposal-copy-label" aria-live="polite"></span>
      </div>
      {% if monologue %}<div class="lv-proposal__prose" id="lv-proposal-lines" lang="fr"></div>
      {% else %}<ol class="lv-proposal__lines" id="lv-proposal-lines"></ol>{% endif %}
    {% endif %}
  </details>
</section>
